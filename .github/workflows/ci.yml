name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: concurrency-toolkit-jar
          path: target/*.jar

  # The concurrency tests assert invariants rather than timings, so they must hold on
  # any number of cores. A second JVM makes a scheduling-dependent pass less likely to
  # go unnoticed.
  stress:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Repeat the concurrency suite
        run: |
          for attempt in 1 2 3; do
            echo "::group::stress run $attempt"
            ./mvnw -B test -Dtest=ConcurrencyStressTest
            echo "::endgroup::"
          done
